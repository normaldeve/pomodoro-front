name: Frontend CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/pomodoro-frontend

    steps:
      # 1️⃣ 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ 이미지 태그 설정
      - name: Set FRONT_IMAGE_TAG from commit SHA
        id: vars
        run: echo "FRONT_IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # 3️⃣ 프론트엔드 환경변수 생성 🔥
      - name: Set frontend env vars
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=http://${{ secrets.SSH_HOST }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_WS_BASE_URL=ws://${{ secrets.SSH_HOST }}" >> $GITHUB_ENV

      # 4️⃣ Docker 로그인
      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # 5️⃣ Docker build (🔥 build-arg 주입)
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL \
            --build-arg NEXT_PUBLIC_WS_BASE_URL=$NEXT_PUBLIC_WS_BASE_URL \
            -t $IMAGE_NAME:${{ steps.vars.outputs.FRONT_IMAGE_TAG }} \
            -t $IMAGE_NAME:latest .

      # 6️⃣ Docker push
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ steps.vars.outputs.FRONT_IMAGE_TAG }}
          docker push $IMAGE_NAME:latest

      # 7️⃣ 홈 서버 배포
      - name: Deploy on home server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.FRONTEND_SERVER_DIR }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export FRONT_IMAGE_TAG=${{ steps.vars.outputs.FRONT_IMAGE_TAG }}
            chmod +x deploy_frontend.sh
            ./deploy_frontend.sh